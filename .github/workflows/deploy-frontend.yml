name: 프론트 GHCR 빌드 및 배포

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      base_commit:
        description: "검증할 변경 범위의 기준 commit SHA"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/carrotbat410/lol-team-balance-tool-front

jobs:
  harness-check:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 검증 기준 커밋 결정
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_commit="${{ github.event.before }}"
          else
            base_commit="${{ inputs.base_commit }}"
          fi
          git cat-file -e "${base_commit}^{commit}"
          git merge-base --is-ancestor "$base_commit" HEAD
          echo "base=$base_commit" >> "$GITHUB_OUTPUT"

      - name: AI harness 단위 테스트
        id: unit-tests
        continue-on-error: true
        run: python3 -m unittest discover -s scripts/ai_harness/tests -p 'test_*.py'

      - name: AI harness 정책 검증
        id: validation
        if: steps.baseline.outcome == 'success'
        continue-on-error: true
        run: >-
          python3 scripts/ai_harness/validate.py --mode ci
          --base "${{ steps.baseline.outputs.base }}"
          --report .ai-runtime/reports/ai-harness-report.json

      - name: 기준 실패 보고서 생성
        if: always()
        shell: bash
        run: |
          mkdir -p .ai-runtime/reports
          if [[ ! -f .ai-runtime/reports/ai-harness-report.json ]]; then
            printf '%s\n' '{"schema_version":"1.0","mode":"ci-fallback","base_commit":"unresolved","status":"failed","exit_status":1,"checks":[{"name":"baseline-or-validator","status":"failed"}],"failed_check_names":["baseline-or-validator"]}' > .ai-runtime/reports/ai-harness-report.json
          fi

      - name: 본문 없는 검증 보고서 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-harness-deploy-report
          path: .ai-runtime/reports/ai-harness-report.json
          retention-days: 7
          if-no-files-found: error

      - name: 정책 검증 실패 반영
        if: always() && (steps.baseline.outcome != 'success' || steps.unit-tests.outcome != 'success' || steps.validation.outcome != 'success')
        run: exit 1

  build-and-push:
    runs-on: ubuntu-24.04-arm
    needs: harness-check

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 프론트 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [harness-check, build-and-push]

    env:
      APP_SERVER_HOST: ${{ secrets.APP_SERVER_HOST }}
      APP_SERVER_USER: ${{ secrets.APP_SERVER_USER }}
      APP_SERVER_PORT: ${{ secrets.APP_SERVER_PORT || '22' }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: SSH 키 설정
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.APP_SERVER_SSH_KEY }}" > ~/.ssh/app_server_key
          chmod 600 ~/.ssh/app_server_key
          ssh-keyscan -p "$APP_SERVER_PORT" -H "$APP_SERVER_HOST" >> ~/.ssh/known_hosts

      - name: 앱 서버 compose/nginx 설정 동기화
        run: |
          scp -P "$APP_SERVER_PORT" -i ~/.ssh/app_server_key deploy/app-server/docker-compose.yml "$APP_SERVER_USER@$APP_SERVER_HOST:/home/ubuntu/app-stack/docker-compose.yml"
          scp -P "$APP_SERVER_PORT" -i ~/.ssh/app_server_key deploy/app-server/nginx/default.conf "$APP_SERVER_USER@$APP_SERVER_HOST:/tmp/app-stack.conf"

      - name: 앱 서버 프론트 배포
        run: |
          ssh -p "$APP_SERVER_PORT" -i ~/.ssh/app_server_key "$APP_SERVER_USER@$APP_SERVER_HOST" <<'REMOTE'
            set -e
            sudo mv /tmp/app-stack.conf /etc/nginx/conf.d/app-stack.conf
            sudo nginx -t
            sudo systemctl reload nginx

            cd /home/ubuntu/app-stack
            sudo docker compose pull lol-front
            sudo docker compose up -d --no-deps lol-front
            sudo docker image prune -f
          REMOTE
